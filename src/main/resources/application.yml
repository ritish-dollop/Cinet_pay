spring:
  application:
    name: Cinet_pay

  datasource:
    url: jdbc:mysql://localhost:3306/cinetpay_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

cinetpay:
  apikey: ${CINETPAY_API_KEY}
  api-password: ${CINETPAY_API_PASSWORD}
  base-url: https://api.cinetpay.net

  success-url: http://localhost:8080/api/payment/success
  failed-url: http://localhost:8080/api/payment/failed
  notify-url: http://localhost:8080/api/payment/notify

  lang: fr
  direct-pay: false

webhook-secret: ${WEBHOOK_SECRET}