name: deploy

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Prepare Deployment
        run: |
          mkdir -p deployment
          if ls target/*-exec.jar 1> /dev/null 2>&1; then
            cp target/*-exec.jar deployment/cinet-pay.jar
          else
            cp target/*.jar deployment/cinet-pay.jar
          fi
          echo "Prepared JAR: $(ls -lh deployment/cinet-pay.jar)"

      - name: Setup SSH
        if: env.SERVER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add Server to Known Hosts
        if: env.SERVER_HOST != ''
        run: |
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure Remote Directory Exists
        if: env.SERVER_HOST != ''
        run: |
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/cinetpay-app"

      - name: Upload JAR
        if: env.SERVER_HOST != ''
        run: |
          scp -P "${SERVER_PORT:-22}" deployment/cinet-pay.jar "$SERVER_USER@$SERVER_HOST:~/cinetpay-app/cinet-pay.jar"

      - name: Restart Backend Service
        if: env.SERVER_HOST != ''
        run: |
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "sudo systemctl restart cinetpay 2>/dev/null || (pkill -f cinet-pay.jar || true; nohup java -jar ~/cinetpay-app/cinet-pay.jar > ~/cinetpay-app/app.log 2>&1 &)"

      - name: Verify Health
        if: env.SERVER_HOST != ''
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${SERVER_HOST}:8080/api/health" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Application is UP (HTTP 200)!"
              exit 0
            fi
            echo "Waiting for app to start... (attempt $i/12, status: $STATUS)"
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1

      - name: Deployment Successful
        run: |
          echo "=========================================="
          echo "Application build and deployment completed!"
          echo "=========================================="
