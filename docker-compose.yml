version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cinetpay-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cinetpay_db}
      MYSQL_USER: ${DB_USERNAME:-cinetuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cinetpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Expose locally if DB_EXTERNAL_PORT is defined, e.g., 3306 for external management
      - "${DB_EXTERNAL_PORT:-127.0.0.1:3306}:3306"
    networks:
      - cinetpay-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${APP_IMAGE:-ghcr.io/ritish-dollop/cinet-pay:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinetpay-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cinetpay_db}
      DB_USERNAME: ${DB_USERNAME:-cinetuser}
      DB_PASSWORD: ${DB_PASSWORD:-cinetpass}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD}
      CINETPAY_BASE_URL: ${CINETPAY_BASE_URL:-https://api.cinetpay.net}
      CINETPAY_SUCCESS_URL: ${CINETPAY_SUCCESS_URL:-http://localhost:8080/api/payment/success}
      CINETPAY_FAILED_URL: ${CINETPAY_FAILED_URL:-http://localhost:8080/api/payment/failed}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL:-http://localhost:8080/api/payment/notify}
      CINETPAY_LANG: ${CINETPAY_LANG:-fr}
      CINETPAY_DIRECT_PAY: ${CINETPAY_DIRECT_PAY:-false}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - cinetpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s

volumes:
  mysql_data:
    driver: local

networks:
  cinetpay-network:
    driver: bridge
